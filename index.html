<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Лабораторна робота №2</title>
    <link rel="stylesheet" href="style.css">
    <style>
        p {
            color: darkgreen;
            font-size: 18px;
        }
        .mark {
            background-color: yellow;
        }
    </style>
</head>
<body>
    <h1 style="color: darkblue; text-align: center;">Комп'ютерна інженерія</h1>
    <ul id="menu">
        <li><a href="#">Головна</a></li>
        <li><a href="#">Новини</a></li>
        <li><a href="#">Контакти</a></li>
    </ul>
    <div id="intro">
        <span class="label">Нове</span>
        <p>Комп'ютерна інженерія поєднує <b class="mark">електроніку</b> та <i>програмування</i>.</p>
        <p>Більше про університет можна дізнатися на сайті <a href="https://nure.ua/">НУРЕ</a>.</p>
    </div>
    <div>
        <h2>Що вивчають</h2>
        <ul>
            <li>Програмування</li>
            <li>Комп'ютерні мережі</li>
            <li>Схемотехніку</li>
        </ul>
    </div>
    <div id="choice">
        <input type="radio" name="level" id="r1" checked>
        <label for="r1">Перший</label>
        <input type="radio" name="level" id="r2">
        <label for="r2">Другий</label>
        <input type="radio" name="level" id="r3">
        <label for="r3">Третій</label>
    </div>
    <div id="boxes">
        <div id="b1">1</div>
        <div id="b2">2</div>
        <div id="b3">3</div>
        <div id="b4">4</div>
    </div>
</body>
</html>
